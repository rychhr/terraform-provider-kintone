name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate release tag
        run: scripts/validate-release-tag.sh "$GITHUB_REF_NAME" origin/main
  release:
    name: Draft release
    needs: validate
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: Verify imported GPG fingerprint
        env:
          EXPECTED_GPG_FINGERPRINT: E94B0DA8102D1D1AB8A5D01E925F019641552B8E
          IMPORTED_GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          normalize_fingerprint() {
            printf '%s' "$1" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]'
          }
          imported_fingerprint=$(normalize_fingerprint "$IMPORTED_GPG_FINGERPRINT")
          expected_fingerprint=$(normalize_fingerprint "$EXPECTED_GPG_FINGERPRINT")
          if [ "$imported_fingerprint" != "$expected_fingerprint" ]; then
            printf '%s\n' 'imported GPG fingerprint does not match the production signing key' >&2
            exit 1
          fi
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
      - name: Verify release artifacts
        run: scripts/verify-release-artifacts.sh dist
