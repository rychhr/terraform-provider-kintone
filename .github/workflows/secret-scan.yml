# Runs the same gitleaks configuration the pre-commit hooks run, because a hook
# that a contributor never installed protects nothing.
#
# Three things are scanned: the tree at the tip, the diffs the event introduces,
# and the commit messages it introduces. The diffs matter on their own — a
# secret added in one commit and removed in the next leaves the tip tree clean
# while the blob stays retrievable by its SHA.
#
# The commit scans are deliberately scoped to the commits the event introduces
# rather than to the whole history: a session link reached a commit message in
# this repository before the rule existed, rewriting history is not worth the
# force-push, and a full-history scan would therefore fail on `main` forever.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  # Only pull-request runs are safe to cancel: each one re-scans the whole
  # branch. A push run scans an increment, so cancelling it would leave the
  # commits of that push — a merge or squash message among them — unscanned.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with the gitleaks rev in .pre-commit-config.yaml.
  GITLEAKS_VERSION: v8.30.1

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The commit scans walk a revision range, so they need the history
          # rather than a single commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The version is pinned here rather than downloaded from a release, so
      # that the Go checksum database verifies it and CI and the hooks build the
      # same source. GOPATH/bin is added to PATH explicitly rather than assumed:
      # every scan step below invokes `gitleaks` by name.
      - name: Install gitleaks
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      # Workflow expressions are passed through the environment rather than
      # interpolated into the script, so that nothing from the event can be read
      # as shell syntax.
      - name: Determine the commits to scan
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            selector="${PR_BASE_SHA}..${PR_HEAD_SHA}"
            log_opts="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            # A branch that did not exist before this push has no usable "from"
            # commit, and the pushed commit may be a root commit. Scan it alone
            # rather than walking its ancestry, which would reach commits that
            # predate this configuration.
            selector="--max-count=1 ${HEAD_SHA}"
            log_opts="--max-count=1 ${HEAD_SHA}"
          else
            selector="${PUSH_BEFORE_SHA}..${HEAD_SHA}"
            log_opts="${PUSH_BEFORE_SHA}..${HEAD_SHA}"
          fi
          echo "selector=${selector}" >>"$GITHUB_OUTPUT"
          echo "log_opts=${log_opts}" >>"$GITHUB_OUTPUT"
          echo "Scanning commits selected by: ${selector}"

      - name: Scan file content
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner

      - name: Scan commit diffs
        env:
          LOG_OPTS: ${{ steps.commits.outputs.log_opts }}
        run: |
          gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner \
            --log-opts="$LOG_OPTS"

      - name: Scan commit messages
        env:
          SELECTOR: ${{ steps.commits.outputs.selector }}
        run: |
          # SELECTOR is a list of git rev-list arguments and is split on purpose.
          # shellcheck disable=SC2086
          scripts/scan-commit-messages.sh $SELECTOR

      - name: Test the ruleset
        run: scripts/test-gitleaks-rules.sh
