# gitleaks configuration for this repository.
#
# The default ruleset covers credentials. It does not cover an agent session
# link: `https://claude.ai/code/session_...` is not shaped like a secret, so no
# default rule matches it, and AGENTS.md forbids publishing one anywhere. The
# rule below is that missing rule.
#
# `gitleaks git` scans diffs, not commit messages, so a link that appears only
# in a commit message is invisible to it. Scanning the message is the job of the
# `commit-msg` hook in .pre-commit-config.yaml and of
# scripts/scan-commit-messages.sh in CI; this file only says what counts as a
# hit.

title = "terraform-provider-kintone"

[extend]
useDefault = true

[[rules]]
id = "agent-session-link"
description = "Agent session link (claude.ai/code/session_...). AGENTS.md forbids publishing one: strip it from the commit message, the file, or the pull request body."
regex = '''(?i)claude\.ai/code/session_[A-Za-z0-9_-]{10,}'''
keywords = ["claude.ai/code/session_"]

# Notes for whoever edits the rule, each verified against gitleaks 8.30.1 with
# scripts/test-gitleaks-rules.sh:
#
# - `(?i)` is there because a host name is case-insensitive, so a link written
#   `Claude.ai/code/session_...` resolves just the same. The keyword prefilter
#   is already case-insensitive and needs no change.
# - What keeps the rule off the placeholder form `session_...` that AGENTS.md
#   quotes while stating the rule is the character class: `.` is not in
#   `[A-Za-z0-9_-]`. Widening that class would start flagging this repository's
#   own documentation.
# - The `{10,}` floor keeps the rule off short illustrative ids such as
#   `session_ID`. Real ids are far longer.
# - There is deliberately no rule for the bare `Claude-Session:` trailer.
#   AGENTS.md quotes that string too, so a rule matching it would fail every
#   commit that touches AGENTS.md, and the trailer always carries the URL the
#   rule above already matches.
